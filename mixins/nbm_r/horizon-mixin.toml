[[injection]]
id = "before-break"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::break_block"
helper = "break.rs"
bindings = [{ name = "pos", ty = "[i32;3]", value = "pos" }]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
    { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "interaction"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_interaction_key"
helper = "interaction.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "key_mapping", ty = "&str", value = "key_mapping" },
  { name = "hand", ty = "horizon_client::first_person::Hand", value = "hand" },
  { name = "swing_hand", ty = "&mut bool", value = "swing_hand" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]
